services:
  kolejka:
    build: .
    image: kolejka:latest
    restart: unless-stopped
    ports:
      # Tylko lokalnie – publiczny dostęp przez reverse proxy (np. nginx z TLS).
      - "127.0.0.1:5432:5432"
    volumes:
      - kolejka-data:/app/data
      # Lista uprawnionych osób – edytujesz ją na hoście, zmiany wczytują się same.
      - ./whitelist.yaml:/app/whitelist.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  kolejka-data:
