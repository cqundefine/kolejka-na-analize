services:
  kolejka:
    build: .
    image: kolejka:latest
    restart: unless-stopped
    ports:
      # Tylko lokalnie – publiczny dostęp przez reverse proxy (np. nginx z TLS).
      - "127.0.0.1:3000:3000"
    volumes:
      - kolejka-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  kolejka-data:
