<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kolejka do zadań</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Kolejka do zadań</h1>

    <form id="name-form" autocomplete="off">
      <label for="name">Imię i nazwisko</label>
      <div class="row">
        <input id="name" name="name" type="text" maxlength="200" placeholder="np. Anna Kowalska" required>
        <button type="submit">Dalej</button>
      </div>
    </form>

    <section id="join-panel" hidden>
      <p>Zapisujesz się jako: <span id="who" class="first"></span></p>
      <div class="row">
        <button type="button" id="join">Zapisz się</button>
        <button type="button" id="back">Zmień imię</button>
      </div>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <section>
      <h2>Na czele kolejki</h2>
      <p id="first" class="first">—</p>
    </section>

    <section>
      <h2>Kolejka</h2>
      <ol id="queue"></ol>
      <p id="empty" hidden>Brak osób w kolejce.</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
